<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kapilla Group</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #ffffff;
        color: #0b1f3a;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        padding: 32px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin: 0;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: rgba(11, 31, 58, 0.66);
        max-width: 320px;
        line-height: 1.5;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(11, 31, 58, 0.12);
        border-top-color: #ffc72c;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        margin-top: 8px;
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: #ffc72c;
        color: #0b1f3a;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Kapilla Group</h1>
    <p id="status">Connecting to Kapilla Group&hellip; Please check your internet connection.</p>
    <button type="button" id="retry">Retry</button>
    <script>
      (function () {
        var FALLBACK_URL = 'https://kapillagroup.vercel.app';

        // The error page is served from the local shell URL (e.g. https://localhost/index.html),
        // so location.reload() would only re-render this page. Resolve the real app URL instead.
        function getAppUrl() {
          try {
            if (window.Capacitor && typeof window.Capacitor.getServerUrl === 'function') {
              var url = window.Capacitor.getServerUrl();
              if (url) return url;
            }
          } catch (e) {
            // ignore
          }
          if (window.WEBVIEW_SERVER_URL) return window.WEBVIEW_SERVER_URL;
          return FALLBACK_URL;
        }

        var button = document.getElementById('retry');
        var status = document.getElementById('status');

        function reopenApp() {
          button.disabled = true;
          button.textContent = 'Retrying\u2026';
          status.textContent = 'Reconnecting to Kapilla Group\u2026';
          // Navigate back to the real app URL so the WebView re-attempts the remote app.
          window.location.replace(getAppUrl());
        }

        button.addEventListener('click', reopenApp);

        // When connectivity returns, reopen the app automatically.
        window.addEventListener('online', reopenApp);
      })();
    </script>
  </body>
</html>
