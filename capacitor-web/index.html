<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kapilla Group</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: radial-gradient(circle at 50% 20%, #14335c 0%, #0b1f3a 60%, #071427 100%);
        color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        padding: 32px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin: 0;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.72);
        max-width: 320px;
        line-height: 1.5;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.18);
        border-top-color: #ffc72c;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        margin-top: 8px;
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: #ffc72c;
        color: #0b1f3a;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Kapilla Group</h1>
    <p id="status">Connecting to Kapilla Group&hellip; Please check your internet connection.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </body>
</html>
